{% set name = "pybispectra" %}
{% set version = "1.3.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pybispectra-{{ version }}.tar.gz
  sha256: beb04525097468901cf62e6a980d93bbca227cbda22f7fd1c63e43870a690ce6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - joblib >=1.2
    - matplotlib-base >=3.6
    - mne-base >=1.7
    - numba >=0.56
    - numpy >=1.22
    - scikit-learn >=1.1
    - scipy >=1.8

test:
  imports:
    - pybispectra
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://pybispectra.readthedocs.io/
  summary: A Python signal processing package for computing spectral-domain and time-domain interactions using the bispectrum.
  dev_url: https://github.com/braindatalab/PyBispectra
  doc_url: https://pybispectra.readthedocs.io/
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - tsbinns
